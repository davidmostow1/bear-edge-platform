name: Materialize Unified MLB Repair Source

on:
  pull_request:
    branches:
      - master
    paths:
      - '.sweet-bear-bootstrap/**'
      - '.github/workflows/materialize-unified-mlb-repair-source.yml'

permissions:
  contents: write

concurrency:
  group: materialize-unified-mlb-repair-source-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect bootstrap payload
        id: payload
        shell: bash
        run: |
          if compgen -G '.sweet-bear-bootstrap/chunk-*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Expand reviewed source archive
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          cat .sweet-bear-bootstrap/chunk-* > /tmp/sweet-bear-mlb-machine.tar.gz.b64
          base64 --decode /tmp/sweet-bear-mlb-machine.tar.gz.b64 > /tmp/sweet-bear-mlb-machine.tar.gz
          tar -tzf /tmp/sweet-bear-mlb-machine.tar.gz > /tmp/materialized-files.txt
          grep -q '^sweet-bear-mlb-machine/' /tmp/materialized-files.txt
          tar -xzf /tmp/sweet-bear-mlb-machine.tar.gz -C .
          test -f sweet-bear-mlb-machine/package.json
          rm -f /tmp/sweet-bear-mlb-machine.tar.gz.b64 /tmp/sweet-bear-mlb-machine.tar.gz

      - name: Verify materialized baseline
        if: steps.payload.outputs.present == 'true'
        working-directory: sweet-bear-mlb-machine
        run: npm run verify

      - name: Commit reviewable direct source
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          rm -rf .sweet-bear-bootstrap
          rm -f .github/workflows/sweet-bear-mlb-bootstrap.yml
          rm -f .github/workflows/materialize-unified-mlb-repair-source.yml
          git config user.name 'sweet-bear-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore(sweet-bear): materialize unified MLB source for integrity repair'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
